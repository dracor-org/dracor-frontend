name: Deployment

# Builds the frontend and deploys it with rsync over SSH. Each GitHub
# environment has its own DEPLOY_KEY, which the server restricts to rsync into
# /var/www/html (see dracor-org-deployment), so the destination path is
# relative to it. The build runs in a job of its own, so that the dependencies
# never get access to the key.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      host:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `version.sh` runs `git describe --tags` during the build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"
      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: ./version.sh
      - run: git describe --tags --dirty --always
      - run: pnpm install
      - run: |
          echo "VITE_DRACOR_GUIDELINES=/odd.html" >> "$GITHUB_ENV"
          echo "VITE_SITEMAP_URL=/doc/sitemap.json" >> "$GITHUB_ENV"
          echo "VITE_WITH_RAHTZ_PRIZE=yes" >> "$GITHUB_ENV"
          echo "VITE_DRACOR_LEGACY_API=/api/v0" >> "$GITHUB_ENV"
      - run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: build/
          # otherwise e.g. a .htaccess would be missing and rsync deletes it
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # robots.txt and the Google verification file come from
      # dracor-org-deployment
      - name: Deploy to ${{ inputs.host }}
        env:
          HOST: ${{ inputs.host }}
        run: |
          rsync -rlvz --delete \
            --exclude=robots.txt \
            --exclude=google*.html \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes' \
            build/ \
            "github@$HOST:/"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
